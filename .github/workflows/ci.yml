name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # Workspace tests run real jj against tmpdir fixtures.
      - name: Install jj
        env:
          JJ_VERSION: v0.44.0
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          curl -fsSL "https://github.com/jj-vcs/jj/releases/download/${JJ_VERSION}/jj-${JJ_VERSION}-x86_64-unknown-linux-musl.tar.gz" | tar -xz -C "$tmp"
          sudo install -m 0755 "$tmp/jj" /usr/local/bin/jj
          jj --version

      # The frontend depends on a vendored xterm.js build (see scripts/setup-xterm.sh).
      # Building it takes minutes, so cache the built tree keyed on the pinned commit.
      - name: Read pinned xterm.js commit
        id: xterm
        run: echo "commit=$(sed -n 's/^COMMIT="\(.*\)"$/\1/p' scripts/setup-xterm.sh)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: |
            vendor/xterm.js
            !vendor/xterm.js/node_modules
          key: xterm-${{ steps.xterm.outputs.commit }}

      - name: Build vendored xterm.js
        run: test -d vendor/xterm.js/lib || bash scripts/setup-xterm.sh

      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run test:backend
      - run: pnpm run test:frontend
